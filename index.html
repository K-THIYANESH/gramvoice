<!doctype html>
<html lang="ta">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GramVoice TN — தமிழ்நாடு ஊரக உள்ளாட்சி மக்கள் தளம்</title>
    <meta name="description" content="Voice-first, bilingual civic governance platform connecting rural Tamil Nadu citizens with Panchayat, Block, and District administrations." />
    
    <!-- PWA Web App Manifest & Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#065f46" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="GramVoice TN" />
    
    <!-- Apple iOS Safari Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GramVoice TN" />
    <link rel="apple-touch-icon" href="/pwa-icon.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.svg" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.svg" />

    <!-- Favicon and Icons -->
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
    <link rel="mask-icon" href="/pwa-icon-maskable.svg" color="#047857" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Tamil:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service Worker Registration for PWA Mobile Installation
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((reg) => {
              console.log('[GramVoice TN] PWA Service Worker Registered. Scope:', reg.scope);
            })
            .catch((err) => {
              console.warn('[GramVoice TN] Service Worker Registration note:', err);
            });
        });
      }
    </script>
  </body>
</html>
